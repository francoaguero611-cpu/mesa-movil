<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>try { if (localStorage.getItem("dash_rol") === "atc") location.replace("atencion.html"); } catch (e) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dashboard Lorenzo</title>
<meta name="description" content="Facturación, ROAS y campañas de Meta por oferta y mercado">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=27">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=27">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=60">
<link rel="stylesheet" href="avisos.css?v=2">
<link rel="stylesheet" href="glass.css?v=12">
<link rel="stylesheet" href="pulido.css?v=1">
<link rel="stylesheet" href="mesa.css?v=19">
<link rel="stylesheet" href="movil.css?v=8">
<script>try { if (matchMedia("(max-width: 760px)").matches) document.documentElement.classList.add("ms-cel"); } catch (e) {}</script>
<script>try { localStorage.removeItem("dash_diseno"); localStorage.removeItem("dash_disenos_ver"); } catch (e) {}</script>
<script>
  // Tema antes de pintar, para que no parpadee.
  try { var t = localStorage.getItem("dash_tema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<script>
  // Sin zoom con los dedos ni con doble toque (la app se usa como app, no como página).
  (function () {
    var no = function (e) { e.preventDefault(); };
    document.addEventListener("gesturestart", no, { passive: false });
    document.addEventListener("gesturechange", no, { passive: false });
    document.addEventListener("gestureend", no, { passive: false });
    document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  })();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="boceto" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <div class="marca">
      <h1>Dashboard</h1>
      <svg class="garabato" viewBox="0 0 160 12" aria-hidden="true"><path d="M2 8 C 30 3, 52 11, 80 6 S 130 3, 158 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <p class="hola">Bienvenido</p>
      <div id="badges" class="badges"></div>
    </div>
    <div class="acciones-top">
      <button class="btn icono" id="b-ref" type="button" aria-label="Actualizar datos (pide datos nuevos a Meta)"><span class="gira">↻</span></button>
      <div class="menu-wrap">
        <button class="btn icono" id="b-menu" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menú">☰</button>
        <div class="menu boceto" id="menu" role="menu" hidden></div>
      </div>
    </div>
  </header>
  <nav class="secciones" id="secciones" aria-label="Secciones" hidden></nav>
  <main id="main"></main>
</div>

<div id="barra" class="barra" hidden></div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="modal-raiz"></div>

<script src="app.js?v=150" defer></script>
<script src="avisos.js?v=3" defer></script>
<script src="liquid.js?v=2" defer></script>
<script src="pulido.js?v=2" defer></script>
<script src="mesa.js?v=21" defer></script>
<script src="movil.js?v=6" defer></script>
</body>
</html>
