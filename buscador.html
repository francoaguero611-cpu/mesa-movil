<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cazador</title>
<script>
  // (11/10) El Buscador de ofertas ahora es la sección «Cazador» del Dashboard. Este link viejo lleva ahí.
  location.replace("./" + location.search + "#cazador");
</script>
<style>html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<script>
  // Sin zoom con los dedos ni con doble toque (la app se usa como app, no como página).
  (function () {
    var no = function (e) { e.preventDefault(); };
    document.addEventListener("gesturestart", no, { passive: false });
    document.addEventListener("gesturechange", no, { passive: false });
    document.addEventListener("gestureend", no, { passive: false });
    document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  })();
</script>
</head>
<body>
<p><a href="./#cazador">Abrir el Cazador</a></p>
</body>
</html>
