<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador de ofertas</title>
<meta name="description" content="Ofertas de la competencia que más escalan y oportunidades por mercado">
<meta name="theme-color" content="#f4efe2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Buscador">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=24">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=24">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=24">
<link rel="stylesheet" href="buscador.css?v=1">
<script>
  // Tema antes de pintar, para que no parpadee.
  try { var t = localStorage.getItem("dash_tema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="boceto" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <div class="marca">
      <a class="bo-volver link" href="index.html">← Dashboard</a>
      <h1>Buscador de ofertas</h1>
      <svg class="garabato" viewBox="0 0 160 12" aria-hidden="true"><path d="M2 8 C 30 3, 52 11, 80 6 S 130 3, 158 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <p class="hola">Competencia ganadora y oportunidades</p>
      <div id="badges" class="badges"></div>
    </div>
    <div class="acciones-top">
      <button class="btn icono" id="b-ref" type="button" aria-label="Actualizar la lista de ofertas"><span class="gira">↻</span></button>
      <button class="btn icono" id="b-tema" type="button" aria-label="Cambiar entre modo claro y oscuro">◐</button>
    </div>
  </header>
  <nav class="bo-tabs" id="tabs" aria-label="Vistas" hidden>
    <button type="button" class="seccion" data-vista="ganadoras" aria-pressed="true">Ganadoras</button>
    <button type="button" class="seccion" data-vista="oportunidades" aria-pressed="false">Oportunidades</button>
    <button type="button" class="seccion" data-vista="seleccionadas" aria-pressed="false">Seleccionadas <span class="num" id="tab-n">(0)</span></button>
  </nav>
  <main id="main"></main>
</div>

<div id="barra" class="barra" hidden></div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="modal-raiz"></div>

<script src="buscador.js?v=2" defer></script>
</body>
</html>
